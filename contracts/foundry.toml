[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

# Packet B's deliberately red requirements harness is opt-in so immutable
# testnet V2 and normal CI stay green. See the mainnet test matrix in docs.
[profile.mainnet-red]
test = "red-test"
